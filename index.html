<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GHOSTFACE — Coming Soon</title>
<meta name="description" content="GHOSTFACE. Post-quantum end-to-end encrypted messaging. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#08080B;
    --gold:#D4AF37;
    --gold-deep:#8C6D1F;
    --gold-pale:#F2DFA0;
    --dim:#8B8B96;
    /* geometry — mirrors app constants */
    --orbit:340px;         /* orbit container */
    --node:64px;           /* nav node size */
    --coin:128px;          /* coin diameter */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--void);
    color:var(--gold-pale);
    font-family:'Space Grotesk',sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(212,175,55,.05), transparent 65%),
      radial-gradient(ellipse 120% 80% at 50% 112%, rgba(212,175,55,.04), transparent 60%);
  }

  /* alias-style header, matching the app's header block */
  .header{position:absolute;top:max(26px, env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none}
  .header .alias{
    font-family:'Michroma',sans-serif;font-size:13px;letter-spacing:.5em;margin-right:-.5em;
    color:var(--gold-pale);
  }
  .header .divider{width:44px;height:1px;margin:10px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .header .tagline{font-size:9px;letter-spacing:.4em;margin-right:-.4em;color:var(--dim);text-transform:uppercase;font-weight:300}

  /* ---------- ORBIT ---------- */
  .orbitWrap{position:relative;display:flex;align-items:center;justify-content:center}
  .orbit{position:relative;width:var(--orbit);height:var(--orbit)}

  /* tick ring — 12 ticks, fades in with reveal, rotates with spin */
  .ring{
    position:absolute;inset:0;
    opacity:0;
    pointer-events:none;
    transition:opacity .36s cubic-bezier(.215,.61,.355,1);
  }
  .ring .tick{
    position:absolute;top:50%;left:50%;
    width:2px;height:10px;margin:-5px 0 0 -1px;
    background:rgba(212,175,55,.75);
    border-radius:1px;
  }
  .open .ring{opacity:1}

  /* center coin */
  .centerWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .centerHit{
    position:relative;width:var(--coin);height:var(--coin);
    background:none;border:none;cursor:pointer;padding:0;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  .centerHit:focus-visible{outline:2px solid var(--gold);outline-offset:8px;border-radius:50%}

  .globeGlow{
    position:absolute;inset:-26px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(212,175,55,.22), rgba(212,175,55,.06) 55%, transparent 72%);
  }

  /* fake thickness — gold edge band, flashes when edge-on */
  .coinEdgeBand{
    position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;
    border-radius:5px;pointer-events:none;
    background:linear-gradient(180deg,#F2DFA0,#D4AF37 40%,#8C6D1F);
    opacity:0;
  }
  .coinEdgeHighlight{
    position:absolute;left:2px;top:8%;bottom:8%;width:2px;border-radius:1px;
    background:rgba(255,248,220,.85);
  }

  /* the spinning coin — perspective 800, rotateY, matches app coinTransform */
  .coinScene{position:absolute;inset:0;perspective:800px;pointer-events:none}
  .coinRim{
    position:absolute;inset:0;border-radius:50%;
    border:3px solid;
    border-color:#F2DFA0 #8C6D1F #8C6D1F #D4AF37;
    box-shadow:
      0 0 0 1px rgba(140,109,31,.6),
      0 0 34px rgba(212,175,55,.28),
      inset 0 0 18px rgba(0,0,0,.55);
    overflow:hidden;
    background:#000;
    transform-style:preserve-3d;
    will-change:transform;
    backface-visibility:visible;
  }
  .coinImage,.coinBlurImage{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;
  }
  .coinBlurImage{filter:blur(14px);opacity:0;transform:scale(1.06)}
  .coinBlurStreaks{position:absolute;inset:0;border-radius:50%;overflow:hidden;opacity:0}
  .coinStreak{
    position:absolute;left:-10%;right:-10%;height:2px;
    background:linear-gradient(90deg,transparent,rgba(242,223,160,.9),transparent);
  }

  .centerHint{
    margin-top:18px;
    font-family:'Michroma',sans-serif;font-size:9px;letter-spacing:.34em;margin-right:-.34em;
    color:var(--dim);
    transition:opacity .36s cubic-bezier(.215,.61,.355,1);
    pointer-events:none;
  }
  .open ~ * .centerHint{opacity:0}

  /* orbiting nav nodes */
  .node{
    position:absolute;width:var(--node);height:var(--node);
    opacity:0;transform:scale(.55);
    transition:opacity .36s cubic-bezier(.215,.61,.355,1), transform .36s cubic-bezier(.215,.61,.355,1);
    pointer-events:none;
  }
  .open .node{opacity:1;transform:scale(1);pointer-events:auto}
  .nodeInner{
    width:100%;height:100%;border-radius:50%;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.28);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:pointer;color:rgba(255,255,255,.88);
    position:relative;overflow:hidden;
    transition:opacity .15s, border-color .2s, box-shadow .2s;
    -webkit-user-select:none;user-select:none;
    padding:0;font-family:inherit;
  }
  .nodeInner::before{ /* specular highlight */
    content:"";position:absolute;top:-40%;left:-20%;width:140%;height:80%;
    background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.35), transparent 65%);
    pointer-events:none;
  }
  .nodeInner:active{opacity:.7}
  .nodeInner:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .node.active .nodeInner{border-color:rgba(212,175,55,.85);box-shadow:0 0 20px rgba(212,175,55,.35), inset 0 1px 0 rgba(255,255,255,.28)}
  .node svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .node .lbl{
    font-family:'Michroma',sans-serif;font-size:6.5px;letter-spacing:.12em;
    color:rgba(255,255,255,.85);
  }

  /* wordmark + footer */
  .wordmark{margin-top:26px;text-align:center;padding:0 24px}
  .wordmark h1{
    font-family:'Michroma',sans-serif;font-size:clamp(20px,6vw,28px);
    letter-spacing:.42em;margin-right:-.42em;
    background:linear-gradient(180deg,var(--gold-pale),var(--gold) 60%,var(--gold-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .wordmark p{margin-top:11px;font-size:10px;font-weight:300;letter-spacing:.3em;margin-right:-.3em;text-transform:uppercase;color:var(--dim)}
  footer{
    position:absolute;bottom:18px;left:0;right:0;text-align:center;
    font-size:9px;letter-spacing:.28em;margin-right:-.28em;text-transform:uppercase;color:#3C3C46;
  }
  .footLinks{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:8px}
  .footLinks a{
    color:var(--dim);text-decoration:none;font-size:10px;letter-spacing:.22em;
    transition:color .2s;padding:6px 2px; /* tap target */
  }
  .footLinks a:hover,.footLinks a:focus-visible{color:var(--gold);outline:none}
  .footLinks i{color:var(--gold-deep);font-style:normal}
  .footCo{color:#3C3C46}

  @media (max-width:400px){:root{--orbit:300px;--node:58px;--coin:116px}}

  /* ---------- SCRATCH OVERLAY ---------- */
  #scratch{position:fixed;inset:0;z-index:50;touch-action:none;cursor:crosshair;transition:opacity 1s ease}
  #scratch.done{opacity:0;pointer-events:none}

  @media (prefers-reduced-motion: reduce){
    .ring,.node,.centerHint{transition-duration:.01s}
  }
</style>
</head>

      t.className='tick';
      t.style.transform=`rotate(${i*30}deg) translateY(${-(R-4)}px)`;
      ring.appendChild(t);
    }
    // nodes: -90 + i*(360/n)
    orbit.querySelectorAll('.node').forEach(n=>n.remove());
    const NODE = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--node'));
    NODES.forEach((node,i)=>{
      const a=(-90 + i*(360/NODES.length))*(Math.PI/180);
      const x=CENTER + R*Math.cos(a) - NODE/2;
      const y=CENTER + R*Math.sin(a) - NODE/2;
      const el=document.createElement('div');
      el.className='node';
      el.style.left=x+'px';
      el.style.top=y+'px';
      el.innerHTML=`<button class="nodeInner" aria-label="${node.label}">
        <svg viewBox="0 0 24 24">${ICONS[node.icon]}</svg>
        <span class="lbl">${node.label}</span>
      </button>`;
      el.querySelector('button').addEventListener('click',()=>{
        orbit.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));
        el.classList.add('active');
      });
      orbit.appendChild(el);
    });
  }
  layout();
  window.addEventListener('resize', layout);

  /* ===== coin physics — ported from app rAF loop =====
     tap kick stacks, capped; velocity decays; edge band flashes edge-on;
     blur crossfades with boost velocity; hold >=220ms grabs/stops the coin */
  const IDLE_DEG_S = 24;          // ambient slow spin
  const TAP_KICK_DEG_S = 720;     // per-tap kick
  const MAX_BOOST_DEG_S = 2600;   // cap so mashing can't break visuals
  const DECAY = 1.6;              // exponential decay rate (1/s)
  const BLUR_START = 900, BLUR_FULL = 2200;

  const coinRim = document.getElementById('coinRim');
  const edgeBand = document.getElementById('edgeBand');
  const coinBlur = document.getElementById('coinBlur');
  const streaks = document.getElementById('streaks');
  const ringEl = ring;

  let rotY = 0;            // degrees
  let ringRot = 0;
  let spinVel = 0;         // boost deg/s (decays)
  let holding = false;
  let last = performance.now();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(now){
    const dt = Math.min((now-last)/1000, .05); last = now;
    // decay boost
    spinVel *= Math.exp(-DECAY*dt);
    if (spinVel < 1) spinVel = 0;
    const idle = reduced ? 0 : IDLE_DEG_S;
    const vel = holding ? 0 : idle + spinVel;
    rotY = (rotY + vel*dt) % 360;
    ringRot = (ringRot + (reduced?0:vel*.05 + 2*dt)) % 360;

    coinRim.style.transform = `rotateY(${rotY}deg)`;
    ringEl.style.transform = `rotate(${ringRot}deg)`;

    // edge band: strongest when edge-on (|cos| near 0)
    const edge = Math.pow(1 - Math.abs(Math.cos(rotY*Math.PI/180)), 3);
    edgeBand.style.opacity = (edge * .9).toFixed(3);

    // motion blur crossfade with boost velocity
    const b = Math.max(0, Math.min(1, (spinVel-BLUR_START)/(BLUR_FULL-BLUR_START)));
    coinBlur.style.opacity = b.toFixed(3);
    streaks.style.opacity = (b*.55).toFixed(3);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ===== tap / hold — mirrors Pressable logic ===== */
  const coinBtn = document.getElementById('coinBtn');
  const stage = orbit;
  const hint = document.getElementById('hint');
  let menuOpen = false;
  let didHold = false, holdTimer = null;

  function toggleMenu(){
    // tap-spin kick, capped
    spinVel = Math.min(spinVel + TAP_KICK_DEG_S, MAX_BOOST_DEG_S);
    menuOpen = !menuOpen;
    stage.classList.toggle('open', menuOpen);
    hint.style.opacity = menuOpen ? 0 : 1;
    coinBtn.setAttribute('aria-label', menuOpen ? 'Hide menu' : 'Tap to reveal menu');
    if (navigator.vibrate) navigator.vibrate(12);
  }

  coinBtn.addEventListener('pointerdown', e => {
    didHold = false;
    holdTimer = setTimeout(()=>{ didHold = true; holding = true; }, 220); // delayLongPress
    coinBtn.setPointerCapture(e.pointerId);
  });
  coinBtn.addEventListener('pointerup', () => {
    clearTimeout(holdTimer);
    holding = false;
    if (!didHold) toggleMenu();     // a hold that stopped the coin shouldn't also toggle
    setTimeout(()=>{ didHold = false; }, 0);
  });
  coinBtn.addEventListener('pointercancel', () => { clearTimeout(holdTimer); holding = false; });

  /* ===== scratch overlay ===== */
  const cv = document.getElementById('scratch');
  const ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W, H, revealed = false, strokes = 0;

  function drawSpaced(text, x, y, spacing){
    const widths=[...text].map(ch=>ctx.measureText(ch).width);
    const total=widths.reduce((a,b)=>a+b,0)+spacing*(text.length-1);
    let cur=x-total/2;
    const align=ctx.textAlign; ctx.textAlign='left';
    [...text].forEach((ch,i)=>{ctx.fillText(ch,cur,y);cur+=widths[i]+spacing});
    ctx.textAlign=align;
  }

  function paintFoil(){
    W=innerWidth; H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalCompositeOperation='source-over';

    const base=ctx.createLinearGradient(0,0,W,H);
    base.addColorStop(0,'#FFFFFF'); base.addColorStop(.45,'#F2F2EE');
    base.addColorStop(.55,'#FAFAF7'); base.addColorStop(1,'#EBEBE6');
    ctx.fillStyle=base; ctx.fillRect(0,0,W,H);

    ctx.save(); ctx.globalAlpha=.5;
    for(let x=-H;x<W+H;x+=46){
      const g=ctx.createLinearGradient(x,0,x+46,0);
      g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.5,'rgba(190,190,182,.16)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.save(); ctx.translate(x,0); ctx.rotate(Math.PI/10);
      ctx.fillRect(0,-H,46,H*3); ctx.restore();
    }
    ctx.restore();

    const cx=W/2, cy=H/2, big=Math.min(W*.11,84);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const gg=ctx.createLinearGradient(0,cy-big,0,cy+big);
    gg.addColorStop(0,'#F2DFA0'); gg.addColorStop(.5,'#D4AF37'); gg.addColorStop(1,'#8C6D1F');
    ctx.font=`${big}px Michroma, sans-serif`;
    ctx.fillStyle=gg; ctx.shadowColor='rgba(140,109,31,.35)'; ctx.shadowBlur=14;
    drawSpaced('COMING',cx,cy-big*.62,big*.14);
    drawSpaced('SOON',cx,cy+big*.62,big*.14);
    ctx.shadowBlur=0;

    ctx.font=`300 ${Math.max(11,W*.014)}px 'Space Grotesk', sans-serif`;
    ctx.fillStyle='#8C6D1F';
    drawSpaced('SCRATCH TO REVEAL',cx,cy+big*1.7,4);

    ctx.font=`${Math.max(10,W*.012)}px Michroma, sans-serif`;
    ctx.fillStyle='#B9995A';
    drawSpaced('GHOSTFACE',cx,cy-big*1.8,6);

    ctx.globalCompositeOperation='destination-out';
    ctx.lineJoin=ctx.lineCap='round';
  }
  paintFoil();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!strokes)paintFoil()});

  let scratching=false, lastP=null;
  const R=()=>Math.max(30,Math.min(W,H)*.055);
  const pt=e=>{const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY}};
  function scratchTo(p){
    ctx.beginPath();
    if(lastP){ctx.lineWidth=R()*2;ctx.moveTo(lastP.x,lastP.y);ctx.lineTo(p.x,p.y);ctx.stroke()}
    ctx.beginPath();ctx.arc(p.x,p.y,R(),0,Math.PI*2);ctx.fill();
    lastP=p;
    if(++strokes%12===0)checkReveal();
  }
  function checkReveal(){
    if(revealed)return;
    const step=24*dpr;
    const data=ctx.getImageData(0,0,cv.width,cv.height).data;
    let clear=0,total=0;
    for(let y=0;y<cv.height;y+=step)for(let x=0;x<cv.width;x+=step){
      total++; if(data[((y*cv.width+x)<<2)+3]<40)clear++;
    }
    if(clear/total>.45){revealed=true;cv.classList.add('done')}
  }
  cv.addEventListener('pointerdown',e=>{scratching=true;lastP=null;scratchTo(pt(e))});
  addEventListener('pointermove',e=>{if(scratching)scratchTo(pt(e))});
  addEventListener('pointerup',()=>{scratching=false;lastP=null});
  addEventListener('resize',()=>{if(!revealed&&strokes===0)paintFoil()});
})();
</script>
</body>
</html>
