<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GHOSTFACE — Coming Soon</title>
<meta name="description" content="GHOSTFACE. No Face. No Trace. Privacy-first mobile communications — coming soon." />
<style>
  :root {
    --bg: #000000;
    --fg: #F0F0F0;
    --accent: #00C8FF;
    --dim: #7a7a7a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "SF Mono", "Menlo", "Consolas", ui-monospace, monospace;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  main {
    max-width: 480px;
  }
  .logo {
    font-size: 15vw;
    line-height: 1;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 18px rgba(0, 200, 255, 0.35));
  }
  @media (min-width: 480px) {
    .logo { font-size: 64px; }
  }
  h1 {
    font-size: 1.6rem;
    letter-spacing: 0.35em;
    margin: 0 0 12px;
    text-transform: uppercase;
  }
  p.tagline {
    color: var(--accent);
    font-size: 0.95rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin: 0 0 32px;
  }
  p.status {
    color: var(--dim);
    font-size: 0.85rem;
    letter-spacing: 0.08em;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
</style>
</head>
<body>
  <main>
    <div class="logo">👻</div>
    <h1>Ghostface</h1>
    <p class="tagline">No Face. No Trace.</p>
    <p class="status"><span class="dot"></span>Coming soon</p>
  </main>
</body>
</html>
